{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Server Incident | Campus Nexus</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/main.css' %}?v=3.2.0">
    <style>
        body {
            background-color: #050B08;
            color: #F3F4F6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        @media (pointer: fine) {
            *, *::before, *::after, body, html {
                cursor: default !important;
            }
            a, button, .btn, [role="button"], input, select {
                cursor: pointer !important;
            }
        }
    </style>
</head>
<body class="error-page no-custom-cursor">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-9 text-center">
                <div class="glass p-5 position-relative overflow-hidden" style="background: rgba(12, 20, 15, 0.88); border: 1px solid rgba(239, 68, 68, 0.35); border-radius: 24px;">
                    <div class="mb-3">
                        <span class="badge bg-danger-subtle text-danger border border-danger px-3 py-1 rounded-pill fw-semibold">
                            <i class="bi bi-exclamation-octagon me-1"></i> HTTP 500 Server Error
                        </span>
                    </div>

                    <div class="feature-icon mx-auto mb-4" style="width: 80px; height: 80px; font-size: 2.2rem; background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.35); color: #EF4444; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                        <i class="bi bi-cpu"></i>
                    </div>

                    <h2 class="fw-bold mb-2">Internal Service Incident</h2>
                    <p class="text-secondary mb-4 mx-auto" style="max-width: 480px;">
                        An unexpected server incident was intercepted. Security safeguards prevent the exposure of internal system tracebacks in production.
                    </p>

                    <div class="d-flex flex-wrap justify-content-center gap-3">
                        <a href="/dashboard/" class="btn btn-green px-4">
                            <i class="bi bi-speedometer2 me-1"></i> Open Dashboard
                        </a>
                        <a href="/" class="btn btn-outline-green px-4">
                            <i class="bi bi-house me-1"></i> Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
